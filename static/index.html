<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChemImage2SMILES</title>
<style>
body{font:15px system-ui,sans-serif;max-width:1050px;margin:35px auto;padding:0 18px;color:#243041;background:#f7f9fb}h1{margin-bottom:6px}.muted{color:#617084}.panel,.card{background:white;border:1px solid #dde4eb;border-radius:10px;padding:18px;margin:14px 0}button,.link{background:#1769aa;color:white;border:0;border-radius:6px;padding:9px 14px;cursor:pointer;text-decoration:none}button:disabled{opacity:.5}input{margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.card img{width:100%;height:180px;object-fit:contain;background:#fff}.card code{overflow-wrap:anywhere}small{color:#667}#status{margin:12px 0}
</style>
<h1>ChemImage2SMILES</h1><p class="muted">上传 JPG/PNG，自动裁剪候选分子并识别结构。请逐一核对结果。</p>
<div class="panel"><form id="form"><input id="file" type="file" accept="image/jpeg,image/png" required><br><button id="run">开始识别</button></form><div id="status"></div><div id="downloads"></div></div>
<div id="results" class="grid"></div>
<script>
const status=document.querySelector('#status'), results=document.querySelector('#results'), downloads=document.querySelector('#downloads');
fetch('/api/health').then(r=>r.json()).then(x=>{status.textContent=`识别后端：${x.backend} · ${x.status}`});
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const button=document.querySelector('#run');button.disabled=true;status.textContent='正在处理…';results.replaceChildren();downloads.replaceChildren();try{const form=new FormData();form.append('file',document.querySelector('#file').files[0]);const response=await fetch('/api/analyze',{method:'POST',body:form});const data=await response.json();if(!response.ok)throw Error(data.detail||response.statusText);status.textContent=`找到 ${data.molecules.length} 个候选区域 · ${data.backend_status}`;for(const format of ['json','csv']){const a=document.createElement('a');a.href=`/api/jobs/${data.job_id}/export.${format}`;a.className='link';a.textContent=`下载 ${format.toUpperCase()}`;a.style.marginRight='8px';downloads.append(a)}for(const m of data.molecules){const card=document.createElement('div');card.className='card';const img=document.createElement('img');img.src=m.crop;img.alt=`分子 ${m.id} 裁剪图`;card.append(img);const title=document.createElement('h3');title.textContent=`候选区域 ${m.id}`;card.append(title);for(const [key,value] of Object.entries({bbox:m.bbox,raw_smiles:m.raw_smiles,canonical_smiles:m.canonical_smiles,isomeric_smiles:m.isomeric_smiles,formula:m.formula,confidence:m.confidence,validation:m.validation})){const p=document.createElement('p');const label=document.createElement('strong');label.textContent=key+': ';const code=document.createElement('code');code.textContent=typeof value==='object'?JSON.stringify(value):value??'—';p.append(label,code);card.append(p)}results.append(card)}}catch(err){status.textContent=`处理失败：${err.message}`}finally{button.disabled=false}};
</script></html>
